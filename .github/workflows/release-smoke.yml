name: Published Action smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.2.0
          persist-credentials: false
      - name: Consume the public version tag
        id: action
        uses: theflock-labs/actions@v0.2.0
        with:
          task-file: examples/runbook/task.json
          mode: runbook
          runbook: examples/runbook/runbook.json
      - name: Check outcome and metering
        env:
          STATUS: ${{ steps.action.outputs.status }}
          CALLS: ${{ steps.action.outputs.model-calls }}
          METERED: ${{ steps.action.outputs.accounting-complete }}
        run: node -e 'if(process.env.STATUS!=="verified" || process.env.CALLS!=="0" || process.env.METERED!=="true") process.exit(1)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-release-receipt
          path: ${{ steps.action.outputs.receipt-path }}
          retention-days: 7
